<?xml version="1.0" encoding="UTF-8"?>
<!--
  O'Malley Brothers, Inc. — Logo Variation B
  Strategy: Stacked industrial wordmark + pipe emblem
  Use: truck wrap, business card front, LinkedIn banner
  Palette: steel blue #1f3a5f · copper #b87333 · cream #f5efe2 · charcoal #2b2b2b
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="O'Malley Brothers Inc. — stacked industrial wordmark with pipe emblem">
  <title>O'Malley Brothers, Inc.</title>

  <rect width="600" height="600" fill="#f5efe2"/>

  <!-- Pipe emblem on the left: vertical insulation-wrapped pipe section -->
  <g transform="translate(150 300)">
    <!-- Outer jacket (insulation), elongated vertical capsule -->
    <rect x="-50" y="-150" width="100" height="300" rx="50" ry="50" fill="#f5efe2" stroke="#1f3a5f" stroke-width="4"/>
    <!-- Copper jacket band (top + bottom) -->
    <rect x="-50" y="-150" width="100" height="22" rx="50" ry="50" fill="#b87333" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="-50" y="128" width="100" height="22" rx="50" ry="50" fill="#b87333" stroke="#1f3a5f" stroke-width="2"/>
    <!-- Center copper band -->
    <rect x="-50" y="-4" width="100" height="8" fill="#b87333"/>
    <!-- Vertical seam line -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#1f3a5f" stroke-width="1" opacity="0.4"/>
    <!-- Rivet dots at top/bottom seams -->
    <circle cx="-25" cy="-140" r="3" fill="#1f3a5f"/>
    <circle cx="25" cy="-140" r="3" fill="#1f3a5f"/>
    <circle cx="-25" cy="140" r="3" fill="#1f3a5f"/>
    <circle cx="25" cy="140" r="3" fill="#1f3a5f"/>
  </g>

  <!-- Wordmark stacked right of the emblem -->
  <g transform="translate(360 300)" text-anchor="middle">
    <!-- O'MALLEY primary line -->
    <text x="0" y="-30" font-family="'Rockwell', 'Roboto Slab', 'Courier New', serif" font-weight="800" font-size="60" fill="#1f3a5f" letter-spacing="2">O'MALLEY</text>
    <!-- Copper horizontal rule -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#b87333" stroke-width="3"/>
    <!-- BROTHERS INC. secondary -->
    <text x="0" y="38" font-family="'Rockwell', 'Roboto Slab', 'Courier New', serif" font-weight="700" font-size="26" fill="#2b2b2b" letter-spacing="6">BROTHERS INC.</text>
    <!-- 1931 tag -->
    <text x="0" y="78" font-family="'Rockwell', 'Roboto Slab', 'Courier New', serif" font-weight="700" font-size="18" fill="#b87333" letter-spacing="4">EST · 1931 · CHICAGO</text>
  </g>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<!--
  O'Malley Brothers, Inc. — Logo Variation D
  Strategy: Modern minimal wordmark + OB monogram
  Use: website header, email signature, LinkedIn, social media
  Palette: steel blue #1f3a5f · copper #b87333 · cream #f5efe2 · charcoal #2b2b2b
  Square 600x600 to match the rest of the system.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="O'Malley Brothers Inc. — modern minimal wordmark with OB monogram">
  <title>O'Malley Brothers — Mechanical Insulation, Chicago</title>

  <rect width="600" height="600" fill="#f5efe2"/>

  <!-- OB monogram on the left, sized to fit square frame -->
  <g transform="translate(155 300)">
    <!-- Outer copper ring -->
    <circle r="78" fill="#b87333"/>
    <!-- Inner steel-blue field -->
    <circle r="66" fill="#1f3a5f"/>
    <!-- Cream OB monogram -->
    <text x="0" y="18" font-family="'Rockwell', 'Roboto Slab', 'Courier New', serif" font-weight="800" font-size="64" fill="#f5efe2" text-anchor="middle" letter-spacing="-3">OB</text>
    <!-- Tiny 1931 at bottom of monogram -->
    <text x="0" y="46" font-family="'Rockwell', 'Roboto Slab', 'Courier New', serif" font-weight="700" font-size="9" fill="#b87333" text-anchor="middle" letter-spacing="2">1931</text>
  </g>

  <!-- Vertical copper rule between mark and wordmark -->
  <line x1="255" y1="220" x2="255" y2="380" stroke="#b87333" stroke-width="2"/>

  <!-- Wordmark on the right, sized to fit -->
  <g transform="translate(285 300)">
    <!-- O'Malley Brothers in slab serif (smaller so fits within 600 viewBox) -->
    <text x="0" y="-10" font-family="'Rockwell', 'Roboto Slab', 'Courier New', serif" font-weight="700" font-size="32" fill="#1f3a5f" letter-spacing="-0.5">O'Malley Brothers</text>
    <!-- Thin copper underline -->
    <line x1="0" y1="6" x2="270" y2="6" stroke="#b87333" stroke-width="2"/>
    <!-- Tagline -->
    <text x="0" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#2b2b2b" letter-spacing="2">MECHANICAL INSULATION</text>
    <!-- Chicago line -->
    <text x="0" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#2b2b2b" letter-spacing="2">CHICAGO · EST · 1931</text>
  </g>
</svg>